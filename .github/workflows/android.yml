name: "android: build and publish to Google Play"
# Pull requests that touch apps/android only build and lint.
# Publishing is manual only: Actions tab -> this workflow -> "Run workflow" on main.
# One-time setup (Play Console, upload key, secrets): docs/android-play-setup.md
on:
  pull_request:
    paths:
      - "apps/android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      app:
        description: "Which app"
        type: choice
        options: [both, flashcards, baalpeh]
        default: both
      track:
        description: "Play track (internal = your family testers; production needs Play's closed-testing requirement first)"
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      status:
        description: "Release status. Use 'draft' until the app's first release has been published in Play Console; then 'completed'."
        type: choice
        options: [completed, draft]
        default: completed
      upload:
        description: "Upload to Google Play. Untick to only build the signed .aab as a downloadable artifact (needed for the very first upload, which Play requires to be done by hand)."
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    working-directory: apps/android
jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug lintFlashcardsDebug lintBaalpehDebug

  publish:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(inputs.app == 'both' && '["flashcards","baalpeh"]' || format('["{0}"]', inputs.app)) }}
    env:
      APP: ${{ matrix.app }}
      UPLOAD: ${{ inputs.upload }}
    steps:
      - name: Publish only from main
        if: inputs.upload && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Uploading to Google Play only runs from main. Run it from main, or untick 'upload' to just build."
          exit 1

      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Check secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing ANDROID_UPLOAD_KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing ANDROID_UPLOAD_KEYSTORE_PASSWORD"
          if [ "$UPLOAD" = "true" ] && [ -z "$PLAY_JSON" ]; then missing="$missing PLAY_SERVICE_ACCOUNT_JSON"; fi
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets in the 'production' environment:$missing (see docs/android-play-setup.md)"
            exit 1
          fi

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      # versionCode = the workflow run number, so every build is higher than the last.
      - name: Build signed bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: upload
          RUN_NUMBER: ${{ github.run_number }}
        run: ./gradlew "bundle${APP^}Release" -PversionCode="$RUN_NUMBER" -PversionName="1.0.$RUN_NUMBER"

      # Must match applicationId in apps/android/app/build.gradle.kts.
      - name: Package name
        id: meta
        run: |
          case "$APP" in
            flashcards) echo "package=com.torahlearningtools.chederflashcards" >> "$GITHUB_OUTPUT" ;;
            baalpeh)    echo "package=com.torahlearningtools.baalpeh" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Unknown app $APP"; exit 1 ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-release-${{ github.run_number }}
          path: |
            apps/android/app/build/outputs/bundle/${{ matrix.app }}Release/*.aab
            apps/android/app/build/outputs/mapping/${{ matrix.app }}Release/mapping.txt
          if-no-files-found: error

      - name: Upload to Google Play
        if: inputs.upload
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ steps.meta.outputs.package }}
          releaseFiles: apps/android/app/build/outputs/bundle/${{ matrix.app }}Release/app-${{ matrix.app }}-release.aab
          mappingFile: apps/android/app/build/outputs/mapping/${{ matrix.app }}Release/mapping.txt
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}
