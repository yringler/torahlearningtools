name: "baalpeh: test and deploy"
# Runs only when apps/baalpeh (or this file) changes. Deploys only from main.
on:
  push:
    branches: [main]
    paths:
      - "apps/baalpeh/**"
      - ".github/workflows/baalpeh.yml"
  pull_request:
    paths:
      - "apps/baalpeh/**"
      - ".github/workflows/baalpeh.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: baalpeh-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: apps/baalpeh
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - run: npm run build
      - run: npx wrangler d1 migrations apply baalpeh --remote
      - run: npx wrangler deploy
